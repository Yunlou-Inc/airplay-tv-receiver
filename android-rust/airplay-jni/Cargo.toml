[package]
name = "airplay-jni"
version = "0.1.0"
edition = "2021"
description = "JNI bridge exposing airplay-protocol's C-ABI to Android (Kotlin)."
# STATUS: authored in sandbox, NOT built/verified. Build with cargo-ndk for Android ABIs.

[lib]
crate-type = ["cdylib"]
name = "airplay_jni"

[dependencies]
# Pin and review against the exact version available in the trusted build env.
jni = "0.21"
# Core crate stays dependency-free and offline-buildable; this bridge is the only
# consumer of an external crate, and it lives OUTSIDE the protocol-rust workspace
# so the core workspace build remains offline-clean.
airplay-protocol = { path = "../../protocol-rust/crates/airplay-protocol" }
