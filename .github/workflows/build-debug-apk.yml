name: Build debug APK (acceptance)

# Purpose: produce a downloadable, INSTALLABLE debug APK for zero-environment acceptance.
# The acceptance machine needs NO Android Studio / JDK / SDK / Gradle and no macOS upgrade —
# everything is built in the cloud. This workflow is independent of signing secrets:
# upstream's apk.yml builds a signed release and needs STORE/LOCAL secrets + a release tag;
# this one always produces a debuggable APK anyone can install via `adb install -r`.

on:
  workflow_dispatch:
  push:
    # "android" is the branch this fork lives on in the shared repository
    # (the default branch, master, holds the earlier MIT/Apache prototype).
    branches: [master, main, android]

permissions:
  contents: read

jobs:
  apk:
    name: Assemble & upload debug APK
    runs-on: ubuntu-latest
    steps:
      # Native code depends on 4 submodules (UxPlay / libplist / openssl-cmake / FFmpeg).
      # recursive is REQUIRED: CMake compiles their sources and applyUxplayPatches needs
      # UxPlay's git metadata to `git apply` the 9 bundled patches.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Versions must match app/build.gradle.kts: compileSdk 37, NDK 27.0.12077973.
      # --channel=3 lets sdkmanager resolve API 37 even while it is still a preview.
      # build-tools is intentionally not pinned: AGP 9.4.1 auto-provisions the exact
      # revision it needs, avoiding a hard failure on a not-yet-published 37.0.0.
      - name: Install SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-37" "ndk;27.0.12077973" "cmake;3.22.1"

      # Use the checked-in wrapper (Gradle 9.8.1) — no dependency on a missing global Gradle.
      # -Pabis=arm64-v8a builds ONE ABI: OpenSSL+FFmpeg are compiled from source per ABI,
      # so 3 ABIs would be ~3x time/disk on a hosted runner. arm64 covers virtually all TVs.
      # For other devices pass e.g. -Pabis=arm64-v8a,armeabi-v7a,x86_64 (or omit for all 3).
      - name: Assemble debug APK
        run: chmod +x ./gradlew && ./gradlew --no-daemon :app:assembleDebug -Pabis=arm64-v8a --stacktrace

      - name: Verify APK and record digest
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          shasum -a 256 "$APK" | tee "$APK.sha256"
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yunlou-airplaytv-debug-run-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
