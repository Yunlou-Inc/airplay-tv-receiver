name: Build debug APK

# Purpose: produce a downloadable debug APK for acceptance/testing on real devices.
# Acceptance machines do NOT need Android Studio, JDK, SDK, Gradle, or a recent macOS.
# This workflow is intentionally decoupled from ci.yml gates: even if spotless/lint/test
# fail, a buildable APK can still be produced and downloaded.

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  apk:
    name: Assemble & upload debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # gradle-wrapper.jar is intentionally not committed; run Gradle 8.9 directly,
      # matching ci.yml. This avoids depending on a missing wrapper JAR.
      - name: Assemble debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: --no-daemon :app:assembleDebug

      - name: Verify APK and record digest
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airplay-tv-debug-run-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
