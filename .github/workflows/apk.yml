name: Release APK

# Self-contained release delivery.
#
# Signing has two modes:
#   stable    -> repository secrets hold our own release keystore, so APKs from
#                different tags can upgrade each other in place.
#                (SIGNING_KEYSTORE_B64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS /
#                 SIGNING_KEY_PASSWORD — see docs/SIGNING.md)
#   ephemeral -> no secrets present (e.g. a fresh fork): a throwaway key is
#                generated on the runner. The APK installs fine, but a later
#                build cannot overwrite it without uninstalling first.
#
# Push a `v*` tag to build AND publish a GitHub Release with the APK, or use
# "Run workflow" for a build-only verification run (no Release is created).

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "ABI list, comma separated"
        required: false
        default: "armeabi-v7a"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      # Native code depends on 4 submodules; applyUxplayPatches also needs
      # UxPlay's git metadata to `git apply` the bundled patches.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Do NOT use android-actions/setup-android@v3: on current ubuntu-latest
      # images (cmdline-tools 16.0) it looks for the long-removed "tools" package.
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -1)"
          test -n "$SDKMGR" && echo "sdkmanager: $SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true

      - name: Install SDK packages (best effort)
        shell: bash
        run: |
          sdkmanager --channel=3 "platforms;android-37" "ndk;27.0.12077973" "cmake;3.22.1" \
            || echo "WARN: sdkmanager did not install every package; AGP will auto-provision."

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$GITHUB_WORKSPACE/release.jks"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            ALIAS="${KEY_ALIAS:-yunlou}"
            echo "SIGNING_MODE=stable" >> "$GITHUB_ENV"
            echo "Using the persistent release keystore (alias: $ALIAS)"
          else
            # JDK 9+ keytool defaults to PKCS12, which does NOT support different
            # store/key passwords (keypass is ignored); reusing one password
            # avoids AGP's "Get Key failed: Given final block not properly padded".
            PASS="ci-$(openssl rand -hex 16)"
            keytool -genkeypair -alias yunlou -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore "$KS" -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Yunlou AirPlay TV, OU=Open Source, O=Yunlou, C=CN"
            STORE_PASS="$PASS"
            KEY_PASS="$PASS"
            ALIAS="yunlou"
            echo "SIGNING_MODE=ephemeral" >> "$GITHUB_ENV"
            echo "::warning::No signing secrets found; using a throwaway key. APKs from different runs cannot upgrade in place."
          fi
          # printf (not an indented heredoc) keeps the properties lines clean.
          {
            printf 'storeFile=%s\n' "$KS"
            printf 'storePassword=%s\n' "$STORE_PASS"
            printf 'keyAlias=%s\n' "$ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASS"
          } > "$GITHUB_WORKSPACE/local.properties"

      - name: Assemble release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          ABIS="${{ inputs.abis || 'armeabi-v7a' }}"
          # -Pminify=false: R8 shrinking is opt-in, see app/build.gradle.kts.
          ./gradlew --no-daemon :app:assembleRelease -Pabis="$ABIS" -Pminify=false --stacktrace

      - name: Verify signature and produce deliverable
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apksigner.txt | head -1)"
          echo "CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
          VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          NAME="YunlouAirPlayTV-${VERSION}-release.apk"
          cp "$APK" "$NAME"
          shasum -a 256 "$NAME" | tee "$NAME.sha256"
          echo "APK size: $(du -h "$NAME" | cut -f1)"

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [ "$SIGNING_MODE" = "stable" ]; then
            SIGN_NOTE="本版本使用项目固定的发布签名，可直接覆盖安装升级。"
          else
            SIGN_NOTE="本次构建使用 runner 上一次性生成的签名（仓库未配置签名 secrets），**与上一版签名不同，安装前必须先卸载旧版本**。"
          fi
          cat > release-notes.md <<EOF
          ### 云楼投屏 ${VERSION}

          - \`YunlouAirPlayTV-${VERSION}-release.apk\`：armeabi-v7a（32 位通用），**已签名**，可直接 \`adb install -r\`
          - \`.sha256\`：安装包校验文件
          - 构建：JDK 21 / Android SDK 37 / NDK 27.0.12077973 / Gradle 9.8.1，4 个 native 子模块源码编译

          **签名**
          ${SIGN_NOTE}

          签名证书 SHA-256 指纹：
          \`${CERT_SHA256:-unknown}\`

          在 App 内「设置 → 关于 → 签名指纹」可以看到同一份指纹的前 8 字节，用来确认安装包来源。

          **安装**
          1. 设置 → 安全与隐私 → 未知来源应用 → 允许
          2. U 盘格式化 FAT32，APK 放根目录，文件名保持英文短名；剩余空间留 600 MB 以上
          3. 若提示「应用未安装 / 更新不兼容」，先在「设置 → 应用」里卸载旧版本

          **许可**：本项目为 GPL-3.0 衍生作品。对外分发 APK 时须随附完整对应源代码、
          \`LICENSE\` 与 \`NOTICE.md\`，详见仓库根目录。

          本包完成云端构建与签名校验，真机投屏验收以 Release 说明为准。
          EOF

      - name: Remove signing material
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks" "$GITHUB_WORKSPACE/local.properties"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yunlou-airplaytv-release-run-${{ github.run_number }}
          path: |
            YunlouAirPlayTV-*-release.apk
            YunlouAirPlayTV-*-release.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YunlouAirPlayTV-*-release.apk
            YunlouAirPlayTV-*-release.apk.sha256
          body_path: release-notes.md
