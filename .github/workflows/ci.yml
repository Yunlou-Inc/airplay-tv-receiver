name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android (lint, unit test, assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Grant execute permission for gradle
        run: chmod +x gradlew || true
      # gradle-wrapper.jar is intentionally not committed; run Gradle 8.9 directly.
      - name: Spotless check
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: --no-daemon spotlessCheck
      - name: Lint (debug)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: --no-daemon :app:lintDebug
      - name: Unit tests (debug)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: --no-daemon :app:assembleDebug
      - name: Record APK digest
        if: success()
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk || true

  rust:
    name: Rust (fmt, clippy, test, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol-rust
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain-file: rust-toolchain.toml
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Build
        run: cargo build --all-targets
      - name: Security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
